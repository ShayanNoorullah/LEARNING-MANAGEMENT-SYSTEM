<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0F3D6E">
  <meta name="description" content="Sign in to SDC Learn — the online learning platform of Skill Development Council Karachi.">
  <title>Sign in · SDC Learn</title>
  <link rel="icon" href="assets/brand/sdc-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-page">
  <main class="auth">
    <section class="auth-brand">
      <div class="auth-blobs" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="auth-brand-inner">
        <div class="auth-logo rise"><span class="logo-plate"><img data-lockup alt="Skill Development Council Karachi — Government of Pakistan"></span><span><b data-product></b><small data-org-short></small></span></div>
        <h1 class="rise" data-tagline></h1>
        <p class="auth-sub rise" data-subtag></p>
        <div class="auth-stats rise" data-stats></div>
        <div class="auth-stage" aria-hidden="true" data-stage></div>
        <p class="auth-accred rise" data-established></p>
      </div>
      <div class="auth-contact"><span data-icon="phone"></span><span data-phone></span><span data-icon="mail"></span><a data-email></a></div>
    </section>

    <section class="auth-panel">
      <button class="icon-btn auth-theme" data-theme-toggle aria-label="Toggle dark mode"></button>
      <div class="auth-card">
        <div class="auth-card-logo logo-plate"><img data-lockup alt="Skill Development Council Karachi"></div>
        <h2>Welcome back</h2>
        <p class="muted">Sign in to <span data-product></span> to continue learning.</p>
        <div class="alert alert-danger" id="loginError" role="alert" hidden></div>
        <button type="button" class="btn btn-secondary btn-lg btn-block google-btn" id="googleBtn" hidden><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>Continue with Google</span></button>
        <div class="divider divider-tight" id="googleOr" hidden><span>or sign in with email</span></div>
        <form id="loginForm" novalidate>
          <div class="field full"><label class="label" for="email">Email address</label><input class="input input-lg" id="email" type="email" autocomplete="username" required placeholder="you@example.com"></div>
          <div class="field full"><div class="row-between"><label class="label" for="password">Password</label><button type="button" class="link-btn small" id="forgot">Forgot password?</button></div>
            <div class="input-wrap"><input class="input input-lg" id="password" type="password" autocomplete="current-password" required placeholder="Your password"><button type="button" class="icon-btn icon-btn-sm input-addon" id="togglePw" aria-label="Show password"></button></div></div>
          <label class="check"><input type="checkbox" id="remember"><span>Keep me signed in on this device</span></label>
          <button class="btn btn-primary btn-lg btn-block" id="loginBtn" type="submit">Sign in</button>
        </form>
        <div class="demo" id="demo" hidden>
          <div class="divider"><span>Demo accounts</span></div>
          <div class="demo-grid" id="demoGrid"></div>
          <p class="small muted center demo-note">Password <code>Demo@123</code> · evaluation only</p>
        </div>
        <p class="small muted center auth-foot"><a href="verify.html">Verify a certificate</a> · <a data-website target="_blank" rel="noopener"></a></p>
      </div>
    </section>
  </main>
  <script src="js/seed.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/cloud-config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
